# =============================================================================
# Patel Networks / MegaTechzy — Nginx MAIN configuration (nginx:alpine container)
# Mounted read-only at /etc/nginx/nginx.conf by docker-compose.yml.
# Server blocks live in /etc/nginx/conf.d/*.conf (see conf.d/patel.conf).
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # Upload ceiling (product image URLs are remote today, but admin CSV
    # imports / future uploads pass through here). Mirrors Next.js body limits.
    client_max_body_size  20m;

    # --------------------------------------------------------------- gzip ---
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      text/xml
                      application/json
                      application/javascript
                      application/x-javascript
                      application/xml
                      application/rss+xml
                      application/wasm
                      image/svg+xml
                      font/woff2;

    # ---------------------------------------------- websocket upgrade map ---
    # Needed for ws/socket.io style upgrades (HMR overlays, or a future
    # realtime feature). Harmless when unused.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
