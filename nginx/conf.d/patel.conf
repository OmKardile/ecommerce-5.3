# =============================================================================
# Patel Networks / MegaTech — reverse proxy to the Next.js app container
# Mounted read-only at /etc/nginx/conf.d/patel.conf by docker-compose.yml.
#
# - HTTP :80 is ACTIVE now so certbot can complete an http-01 challenge before
#   TLS exists. The HTTPS :443 server block at the bottom is COMMENTED and is
#   enabled after certificates are provisioned (deploy/DEPLOY-STEPS.md, step 7).
# - `app` resolves via Docker's internal network (service name in compose).
# =============================================================================

upstream patel_app {
    server app:3000;
    keepalive 32;
}

# ----------------------------------------------------------------- :80 ------
server {
    listen 80;
    server_name _;

    # Large uploads (admin CSV import, future media) — must match http{} value.
    client_max_body_size 20m;

    # ----------------------------------------------------- security headers --
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------------------------------ ACME challenge path ----
    # Activate together with the certbot-www volume in docker-compose.yml.
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    #     default_type "text/plain";
    # }

    # ------------------------------------------- hashed build assets: 1y -----
    # Content-hashed by Next.js -> safe to mark immutable.
    location /_next/static/ {
        proxy_pass http://patel_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header inheritance gotcha: a location with its own add_header
        # block REPLACES the server-level headers, so re-assert them here.
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------- public/ assets: 1 hour ------
    # public/ currently ships logo.svg; robots.txt + sitemap.xml are app
    # routes. Conservative 1h cache — bump max-age once filenames are hashed.
    location ~* ^/[^?]+\.(svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?|ttf|otf|txt|xml)$ {
        proxy_pass http://patel_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ------------------------------------------- everything else: Next.js ----
    location / {
        proxy_pass http://patel_app;
        proxy_http_version 1.1;

        # WebSocket / HTTP long-poll upgrades (uses the map in nginx.conf)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forwarded identity — required for correct absolute URLs, secure
        # cookies behind TLS, and accurate client IPs in audit logs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }
}

